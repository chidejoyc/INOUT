<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — INOUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header small">
    <div class="container header-inner">
      <a class="logo" href="index.html"><img src="assets/logo.svg" alt="INOUT logo" width="36" height="36"><span class="brand-name">INOUT</span></a>
      <nav class="main-nav" aria-label="Primary">
        <a href="index.html" class="nav-link">Home</a>
        <a href="contact.html" class="nav-link active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Contact</h1>
    <p class="muted">For support and partnership inquiries, email <a href="mailto:support@inout.example">support@inout.example</a>.</p>
    <form class="contact-form">
      <label>Name</label>
      <input type="text" placeholder="Your name">
      <label>Email</label>
      <input type="email" placeholder="you@example.com">
      <label>Message</label>
      <textarea placeholder="How can we help?"></textarea>
      <button class="btn primary">Send</button>
    </form>
  </main>

  <footer class="site-footer small">
    <div class="container">
      <small>© <span id="year9"></span> INOUT</small>
    </div>
  </footer>
</body>
</html>
