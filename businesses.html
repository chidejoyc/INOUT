<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Businesses — INOUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header small">
    <div class="container header-inner">
      <a class="logo" href="index.html"><img src="assets/logo.svg" alt="INOUT logo" width="36" height="36"><span class="brand-name">INOUT</span></a>
      <nav class="main-nav" aria-label="Primary">
        <a href="index.html" class="nav-link">Home</a>
        <a href="businesses.html" class="nav-link active">Businesses</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Businesses</h1>
    <p class="muted">Trusted profiles from across the platform. Click a profile to view details.</p>
    <div id="businessList" class="cards"></div>
  </main>

  <footer class="site-footer small">
    <div class="container">
      <small>© <span id="year4"></span> INOUT</small>
    </div>
  </footer>

  <script>
    // Render businesses list from persisted users (no fake data)
    (function(){
      function escapeHtml(s){ return String(s||'').replace(/[&<>\"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]); }); }
      const list = document.getElementById('businessList');
      const usersRaw = localStorage.getItem('inout_users') || '[]';
      let users = [];
      try{ users = JSON.parse(usersRaw); }catch(e){ users = []; }

      const businesses = users.filter(u => u && (u.accountType === 'business' || u.isBusiness || u.businessName || u.profile));
      if(businesses.length === 0){
        list.innerHTML = `<div class="card"><h3 style="margin:0 0 8px">No businesses found yet</h3><p class="muted">Businesses will appear here once accounts are created.</p></div>`;
      } else {
        list.innerHTML = businesses.map(b => {
          const id = encodeURIComponent(b.id);
          const name = escapeHtml(b.businessName || b.name || 'Unnamed');
          const category = escapeHtml(b.category || '');
          const city = escapeHtml(b.city || b.location && b.location.city || '');
          const short = escapeHtml((b.profile && b.profile.description) || '');
          const logo = (b.profile && b.profile.logoUrl) ? `background-image:url(${b.profile.logoUrl});background-size:cover` : '';
          const initials = escapeHtml((b.businessName||' ').split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase());
          return `<article class="card" data-id="${b.id}">
            <a href="business-profile.html?id=${id}" style="text-decoration:none;color:inherit;display:flex;gap:12px;align-items:center">
              <div class="logo-sm" style="${logo};width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);">
                ${logo? '' : initials}
              </div>
              <div style="flex:1;min-width:0">
                <h4 style="margin:0 0 4px">${name}</h4>
                <div class="muted" style="font-size:13px">${category}${city?` · ${city}`:''}</div>
                <p class="muted" style="margin:8px 0 0;font-size:13px">${short}</p>
              </div>
            </a>
          </article>`;
        }).join('');
      }

      // Update if other tabs change user list
      window.addEventListener('storage', (ev)=>{
        if(ev.key === 'inout_users') location.reload();
      });
    })();
  </script>

  <script src="assets/js/app.js"></script>
</body>
</html>
