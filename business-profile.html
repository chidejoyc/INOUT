<script>
  (function(){
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]); }); }
    function getQueryId(){ const p = new URLSearchParams(location.search); return p.get('id'); }
    function loadBusiness(id){
      try {
        const users = JSON.parse(localStorage.getItem('inout_users') || '[]');
        const b = users.find(u => u.id === id && u.accountType === 'business');
        return b || null;
      } catch(e){ return null; }
    }

    document.addEventListener('DOMContentLoaded', function(){
      const id = getQueryId();
      const nameEl = document.getElementById('bpName');
      const catEl = document.getElementById('bpCategory');
      const descEl = document.getElementById('bpDesc');
      const servicesEl = document.getElementById('bpServices');

      if(!id){
        if(nameEl) nameEl.textContent = 'Business not found';
        if(descEl) descEl.textContent = '';
        return;
      }

      const biz = loadBusiness(id);
      if(!biz){
        if(nameEl) nameEl.textContent = 'Business not found';
        if(descEl) descEl.textContent = '';
        return;
      }

      if(nameEl) nameEl.textContent = biz.businessName || biz.fullName || biz.email;
      if(catEl) catEl.textContent = `${biz.category || ''}${biz.city ? ' · ' + biz.city : ''}`;
      if(descEl) descEl.textContent = (biz.profile && biz.profile.description) || '';
      if(servicesEl){
        servicesEl.innerHTML = (biz.services && biz.services.length) ? biz.services.map(s=>`<li>${escapeHtml(s)}</li>`).join('') : '<li class="muted">No services listed yet</li>';
      }

      // Visit website button hookup
      const visit = document.querySelector('.actions .btn.ghost');
      if(visit && biz.profile && biz.profile.website){
        visit.setAttribute('href', biz.profile.website);
        visit.removeAttribute('onclick');
      } else if(visit){
        visit.style.display = 'none';
      }
    });
  })();
</script>
