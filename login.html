<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — INOUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="auth container">
    <a href="index.html" class="logo auth-logo"><img src="assets/logo.svg" alt="INOUT"> INOUT</a>
    <div class="auth-card">
      <h1>Login</h1>

      <div class="row" style="gap:12px;margin-bottom:12px">
        <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="loginAcctType" value="customer" id="loginCustomer" checked> Customer</label>
        <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="loginAcctType" value="business" id="loginBusiness"> Business</label>
      </div>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" name="email" type="email" placeholder="you@example.com" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" placeholder="••••••" required>

        <div class="row" style="margin-top:12px">
          <button class="btn primary" type="submit">Login</button>
        </div>
      </form>

      <p id="loginMessage" class="muted" style="margin-top:12px"></p>
      <p class="muted">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function(){
      const loginForm = document.getElementById('loginForm');
      const loginMessage = document.getElementById('loginMessage');
      const loginCustomer = document.getElementById('loginCustomer');
      const loginBusiness = document.getElementById('loginBusiness');

      loginForm.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const accountType = loginBusiness.checked ? 'business' : 'customer';
        const payload = {
          accountType,
          email: document.getElementById('loginEmail').value.trim(),
          password: document.getElementById('loginPassword').value
        };

        loginMessage.textContent = 'Logging in...';
        loginMessage.style.color = 'var(--muted)';
        
        try {
          const success = await window.authLogin(payload.email, payload.password, payload.accountType);
          if(success){
            loginMessage.textContent = 'Login successful! Redirecting...';
            loginMessage.style.color = 'var(--primary)';
            setTimeout(() => {
              const user = JSON.parse(localStorage.getItem('inout_user'));
              if(user.accountType === 'business'){
                window.location.href = 'business-dashboard.html';
              } else {
                window.location.href = 'customer-dashboard.html';
              }
            }, 500);
          } else {
            loginMessage.textContent = 'Invalid email or password.';
            loginMessage.style.color = '#dc2626';
          }
        } catch(err){
          console.error(err);
          loginMessage.textContent = 'An error occurred. Check console for details.';
          loginMessage.style.color = '#dc2626';
        }
      });
    })();
  </script>
</body>
</html>
