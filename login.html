<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — INOUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="auth container">
    <a href="index.html" class="logo auth-logo"><img src="assets/logo.svg" alt="INOUT"> INOUT</a>
    <div class="auth-card">
      <h1>Login</h1>

      <div class="row" style="gap:12px;margin-bottom:12px">
        <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="loginAcctType" value="customer" id="loginCustomer" checked> Customer</label>
        <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="loginAcctType" value="business" id="loginBusiness"> Business</label>
      </div>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" name="email" type="email" placeholder="you@example.com" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" placeholder="••••••" required>

        <div class="row" style="margin-top:12px">
          <button class="btn primary" type="submit">Login</button>
        </div>
      </form>

      <p id="loginMessage" class="muted" style="margin-top:12px"></p>
      <p class="muted">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
  <script>
    (function(){
      const loginForm = document.getElementById('loginForm');
      const loginMessage = document.getElementById('loginMessage');
      const loginCustomer = document.getElementById('loginCustomer');
      const loginBusiness = document.getElementById('loginBusiness');

      loginForm.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const accountType = loginBusiness.checked ? 'business' : 'customer';
        const payload = {
          accountType,
          email: document.getElementById('loginEmail').value.trim(),
          password: document.getElementById('loginPassword').value
        };

        loginMessage.textContent = 'Logging in...';
        try {
          // Placeholder: replace with real backend call to /api/auth/login
          // Example:
          // const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
          // const data = await res.json();

          console.log('Login payload:', payload);
          loginMessage.textContent = 'Login submitted. Connect a backend to authenticate users.';

          // Note: do not perform any redirect here — wait for a real backend response before changing pages.
        } catch(err){
          console.error(err);
          loginMessage.textContent = 'An error occurred. Check console for details.';
        }
      });

      // Optionally populate countries on login page too if a country select is present later
      document.addEventListener('DOMContentLoaded', ()=>{
        if(window.populateCountrySelects) window.populateCountrySelects();
      });

    })();
  </script>
</body>
</html>
