<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Explore — INOUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- Reuse header (kept simple here) -->
  <header class="site-header small">
    <div class="container header-inner">
      <a class="logo" href="index.html"><img src="assets/logo.svg" alt="INOUT logo" width="36" height="36"><span class="brand-name">INOUT</span></a>
      <nav class="main-nav" aria-label="Primary">
        <a href="index.html" class="nav-link">Home</a>
        <a href="explore.html" class="nav-link active">Explore</a>
      </nav>
      <div class="header-actions">
        <a href="login.html" class="btn ghost">Login</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="results-head">
      <h1>Explore</h1>

      <!-- Search & Filters -->
      <form id="exploreForm" class="search-bar" onsubmit="return false;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <input id="q" name="q" type="search" placeholder="Search for a business or service" style="flex:1;min-width:160px;padding:10px;border-radius:10px;border:1px solid rgba(15,23,42,0.06);">
          <input id="locationInput" name="location" list="whereList" placeholder="Country / City" style="width:220px;padding:10px;border-radius:10px;border:1px solid rgba(15,23,42,0.06);">
          <select id="filterCategory" style="width:160px;padding:10px;border-radius:10px;border:1px solid rgba(15,23,42,0.06);">
            <option value="">All categories</option>
            <option value="restaurant">Restaurant</option>
            <option value="retail">Retail</option>
            <option value="services">Services</option>
            <option value="beauty">Beauty & Wellness</option>
            <option value="automotive">Automotive</option>
            <option value="education">Education</option>
            <option value="photography">Photography</option>
            <option value="events">Events</option>
            <option value="other">Other</option>
          </select>

          <select id="filterPrice" style="width:120px;padding:10px;border-radius:10px;border:1px solid rgba(15,23,42,0.06);">
            <option value="">Any price</option>
            <option value="$">$</option>
            <option value="$$">$$</option>
            <option value="$$$">$$$</option>
          </select>

          <select id="sortBy" style="width:160px;padding:10px;border-radius:10px;border:1px solid rgba(15,23,42,0.06);">
            <option value="relevance">Sort: Relevance</option>
            <option value="name_asc">Name: A → Z</option>
            <option value="price_asc">Price: Low → High</option>
            <option value="price_desc">Price: High → Low</option>
          </select>

          <button id="searchBtn" class="btn primary" style="padding:10px 14px;border-radius:10px;">Search</button>
          <a href="signup.html" class="btn ghost" style="padding:10px 14px;border-radius:10px;margin-left:auto;">List Your Business</a>
        </div>
      </form>

      <p id="resultsMeta" class="muted" style="margin-top:12px;"></p>
    </section>

    <section id="resultsList" class="cards" style="margin-top:16px;"></section>
  </main>

  <footer class="site-footer small">
    <div class="container">
      <small>© <span id="year2"></span> INOUT</small>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/explore.js"></script>
</body>
</html>
