<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up — INOUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="auth container">
    <a href="index.html" class="logo auth-logo"><img src="assets/logo.svg" alt="INOUT"> INOUT</a>
    <div class="auth-card">
      <h1>Create an account</h1>
      <form>
        <label>Full name</label>
        <input type="text" placeholder="Your name" required>
        <label>Email</label>
        <input type="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input type="password" placeholder="Choose a password" required>
        <div class="row">
          <a href="business-dashboard.html" class="btn ghost">Create Business Account</a>
          <button class="btn primary" type="submit">Sign Up</button>
        </div>
      </form>
      <p class="muted">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
