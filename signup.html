<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up — INOUT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="auth container">
    <a href="index.html" class="logo auth-logo"><img src="assets/logo.svg" alt="INOUT"> INOUT</a>
    <div class="auth-card">
      <h1>Create an account</h1>

      <!-- Account type selector -->
      <div class="row" style="gap:12px;margin-bottom:12px">
        <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="acctType" value="customer" id="acctCustomer" checked> Customer</label>
        <label style="display:flex;align-items:center;gap:8px"><input type="radio" name="acctType" value="business" id="acctBusiness"> Business</label>
      </div>

      <!-- Customer form -->
      <form id="customerForm" class="acct-form" style="display:block">
        <label for="custFullName">Full name</label>
        <input id="custFullName" name="fullName" type="text" placeholder="Your full name" required>

        <label for="custEmail">Email</label>
        <input id="custEmail" name="email" type="email" placeholder="you@example.com" required>

        <label for="custCountry">Country</label>
        <select id="custCountry" name="country" required>
          <option value="">Select country</option>
        </select>

        <label for="custCity">City</label>
        <input id="custCity" name="city" type="text" placeholder="City" required>

        <label for="custPassword">Password</label>
        <input id="custPassword" name="password" type="password" placeholder="Choose a password" required>

        <div class="row" style="margin-top:12px">
          <button class="btn primary" type="submit">Sign up as Customer</button>
        </div>
      </form>

      <!-- Business form -->
      <form id="businessForm" class="acct-form" style="display:none">
        <label for="bizName">Business name</label>
        <input id="bizName" name="businessName" type="text" placeholder="Business name" required>

        <label for="bizOwner">Owner name</label>
        <input id="bizOwner" name="ownerName" type="text" placeholder="Owner full name" required>

        <label for="bizEmail">Email</label>
        <input id="bizEmail" name="email" type="email" placeholder="owner@example.com" required>

        <label for="bizPhone">Phone</label>
        <input id="bizPhone" name="phone" type="tel" placeholder="Phone number" required>

        <label for="bizCountry">Country</label>
        <select id="bizCountry" name="country" required>
          <option value="">Select country</option>
        </select>

        <label for="bizState">State / Region</label>
        <input id="bizState" name="state" type="text" placeholder="State or region" required>

        <label for="bizCity">City</label>
        <input id="bizCity" name="city" type="text" placeholder="City" required>

        <label for="bizCategory">Category</label>
        <select id="bizCategory" name="category" required>
          <option value="">Select category</option>
          <option value="restaurant">Restaurant</option>
          <option value="retail">Retail</option>
          <option value="services">Services</option>
          <option value="other">Other</option>
        </select>

        <label for="bizPassword">Password</label>
        <input id="bizPassword" name="password" type="password" placeholder="Choose a password" required>

        <div class="row" style="margin-top:12px">
          <button class="btn primary" type="submit">Sign up as Business</button>
        </div>
      </form>

      <p id="formMessage" class="muted" style="margin-top:12px"></p>
      <p class="muted">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function(){
      const acctCustomer = document.getElementById('acctCustomer');
      const acctBusiness = document.getElementById('acctBusiness');
      const customerForm = document.getElementById('customerForm');
      const businessForm = document.getElementById('businessForm');
      const formMessage = document.getElementById('formMessage');

      function show(type){
        if(type==='customer'){
          customerForm.style.display = 'block';
          businessForm.style.display = 'none';
        } else {
          customerForm.style.display = 'none';
          businessForm.style.display = 'block';
        }
        formMessage.textContent = '';
      }

      acctCustomer.addEventListener('change', ()=> show('customer'));
      acctBusiness.addEventListener('change', ()=> show('business'));

      // Customer signup
      customerForm.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const payload = {
          accountType: 'customer',
          fullName: document.getElementById('custFullName').value.trim(),
          email: document.getElementById('custEmail').value.trim(),
          country: document.getElementById('custCountry').value,
          city: document.getElementById('custCity').value.trim(),
          password: document.getElementById('custPassword').value
        };

        formMessage.textContent = 'Creating account...';
        formMessage.style.color = 'var(--muted)';

        try {
          const success = await window.authSignup(payload);
          if(success){
            formMessage.textContent = 'Account created! Redirecting to dashboard...';
            formMessage.style.color = 'var(--primary)';
            setTimeout(() => {
              window.location.href = 'customer-dashboard.html';
            }, 500);
          } else {
            formMessage.textContent = 'Email already exists. Please login or use a different email.';
            formMessage.style.color = '#dc2626';
          }
        } catch(err){
          console.error(err);
          formMessage.textContent = 'An error occurred. Check console for details.';
          formMessage.style.color = '#dc2626';
        }
      });

      // Business signup
      businessForm.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const payload = {
          accountType: 'business',
          businessName: document.getElementById('bizName').value.trim(),
          ownerName: document.getElementById('bizOwner').value.trim(),
          email: document.getElementById('bizEmail').value.trim(),
          phone: document.getElementById('bizPhone').value.trim(),
          country: document.getElementById('bizCountry').value,
          state: document.getElementById('bizState').value.trim(),
          city: document.getElementById('bizCity').value.trim(),
          category: document.getElementById('bizCategory').value,
          password: document.getElementById('bizPassword').value
        };

        formMessage.textContent = 'Creating business account...';
        formMessage.style.color = 'var(--muted)';

        try {
          const success = await window.authSignup(payload);
          if(success){
            formMessage.textContent = 'Business account created! Redirecting to dashboard...';
            formMessage.style.color = 'var(--primary)';
            setTimeout(() => {
              window.location.href = 'business-dashboard.html';
            }, 500);
          } else {
            formMessage.textContent = 'Email already exists. Please login or use a different email.';
            formMessage.style.color = '#dc2626';
          }
        } catch(err){
          console.error(err);
          formMessage.textContent = 'An error occurred. Check console for details.';
          formMessage.style.color = '#dc2626';
        }
      });

      // Populate country selects
      document.addEventListener('DOMContentLoaded', ()=>{
        if(window.populateCountrySelects) window.populateCountrySelects();
      });
    })();
  </script>
</body>
</html>
